# Custom RuboCop configuration for vagrant-ssh-config-manager

AllCops:
  NewCops: enable
  SuggestExtensions: false

Metrics/ClassLength:
  Max: 300

Metrics/MethodLength:
  Max: 40
  Exclude:
    - 'lib/vagrant_ssh_config_manager/action/*.rb'
    - 'lib/vagrant_ssh_config_manager/ssh_info_extractor.rb'

Metrics/AbcSize:
  Max: 35
  Exclude:
    - 'lib/vagrant_ssh_config_manager/action/*.rb'
    - 'lib/vagrant_ssh_config_manager/config.rb'
    - 'lib/vagrant_ssh_config_manager/ssh_info_extractor.rb'
    - 'spec/**/*'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'
    - 'vagrant-ssh-config-manager.gemspec'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

# Keep these complexity cops out of the v1 cleanup gate for now. The enabled
# MethodLength/ClassLength/AbcSize gates cover the largest maintainability risks.
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/BlockNesting:
  Enabled: false

# Disable accessor naming cop for spec files (get_ prefix methods allowed in tests)
Naming/AccessorMethodName:
  Enabled: true
  Exclude:
    - 'spec/**/*'

# Require documentation comments on public classes/modules
Style/Documentation:
  Enabled: false

# Ensure super is called in initializers
Lint/MissingSuper:
  Enabled: true

# Disable single-line modifier offenses for now
Style/IfUnlessModifier:
  Enabled: false

# Disable constant scoping and access modifier false positives
Lint/UselessConstantScoping:
  Enabled: false
Lint/UselessAccessModifier:
  Enabled: false

# Disable staffing of gemspec checks
Gemspec/RequireMFA:
  Enabled: false
Gemspec/DevelopmentDependencies:
  Enabled: false

# Spec-specific configurations - allow more flexible patterns in tests
Lint/NoReturnInBeginEndBlocks:
  Exclude:
    - 'spec/**/*'

Naming/PredicateMethod:
  Exclude:
    - 'spec/**/*'
